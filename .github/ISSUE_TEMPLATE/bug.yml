name: Bug report
description: Report a reproducible problem without private UI content.
body:
  - type: input
    id: version
    attributes:
      label: mac-control-mcp version
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Target app and version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Remove conversations, tokens, paths, wallet data and other private information.
    validations:
      required: true
